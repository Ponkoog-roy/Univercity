apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: univercity
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Ponkoog-roy/Univercity.git
    targetRevision: HEAD
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: univercity

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true