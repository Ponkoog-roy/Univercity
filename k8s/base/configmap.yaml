apiVersion: v1
kind: ConfigMap
metadata:
  name: univercity-nginx-conf

  labels:
    app.kubernetes.io/name: univercity
    app.kubernetes.io/component: frontend
data:
  nginx.conf: |
    worker_processes auto;

    error_log /tmp/error.log warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;

      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      access_log /tmp/access.log;

      sendfile on;
      keepalive_timeout 65;

      server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
          try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
          expires 1y;
          add_header Cache-Control "public, immutable";
        }

        location = /index.html {
          add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /healthz {
          access_log off;
          return 200 "ok\n";
        }

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: univercity-runtime-env

  labels:
    app.kubernetes.io/name: univercity
    app.kubernetes.io/component: frontend
data:
  VITE_SUPABASE_URL: "https://REPLACE.supabase.co"
  VITE_SUPABASE_ANON_KEY: "REPLACE"