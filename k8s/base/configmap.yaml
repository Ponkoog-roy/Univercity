apiVersion: v1
kind: ConfigMap
metadata:
  name: univercity-nginx-conf
  namespace: univercity
  labels:
    app.kubernetes.io/name: univercity
    app.kubernetes.io/component: frontend
data:
  nginx.conf: |
    worker_processes auto;
    error_log /tmp/nginx/error.log warn;
    pid /tmp/nginx/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      client_body_temp_path /tmp/nginx/client_temp;
      proxy_temp_path       /tmp/nginx/proxy_temp;
      fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
      uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
      scgi_temp_path        /tmp/nginx/scgi_temp;
      access_log /tmp/nginx/access.log;

      server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback — client-side router (react-router-dom) owns all paths
        location / {
          try_files $uri $uri/ /index.html;
        }

        # Long-cache hashed build assets; never cache the HTML shell
        location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
          expires 1y;
          add_header Cache-Control "public, immutable";
        }
        location = /index.html {
          add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location /healthz {
          access_log off;
          return 200 "ok\n";
        }

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: univercity-runtime-env
  namespace: univercity
  labels:
    app.kubernetes.io/name: univercity
    app.kubernetes.io/component: frontend
data:
  # Placeholder — overlays patch these per environment. Supabase URL + anon key
  # are public client-side values by Supabase's own design (RLS enforces auth),
  # so they belong in a ConfigMap, not a Secret.
  VITE_SUPABASE_URL: "https://REPLACE.supabase.co"
  VITE_SUPABASE_ANON_KEY: "REPLACE"
