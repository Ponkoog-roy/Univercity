apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: uni-frontend-hpa
  namespace: univercity

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uni-frontend

  minReplicas: 2
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70