name: Build Test Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: ponkoog/univercity

jobs:

  test:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint --if-present

      - name: Run Tests
        run: pnpm test --if-present

      - name: Verify Production Build
        run: pnpm build

  build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: meta
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ponkoog/univercity:latest
            ponkoog/univercity:${{ steps.meta.outputs.tag }}

  deploy:
    name: GitOps Manifest Update
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kube Branch
        uses: actions/checkout@v4
        with:
          ref: kube
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update Image Tag
        run: |
          sed -i "s|image: ponkoog/univercity:.*|image: ponkoog/univercity:${{ needs.build.outputs.image_tag }}|g" k8s/deployment.yml

      - name: Commit Manifest Update
        run: |
          git add k8s/deployment.yml

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "ci: deploy image ${{ needs.build.outputs.image_tag }}"

      - name: Push Manifest Changes
        run: |
          git push origin kube