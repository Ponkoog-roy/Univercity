name: Build Test Deploy

on:
  push:
    branches:
      #- main
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: ponkoog/univercity

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g pnpm@11.5.1

      - run: pnpm install

      - run: pnpm build:prod

  build:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Read and Increment Version
        id: version
        shell: bash
        run: |
          VERSION=$(cat VERSION)

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          PATCH=$((PATCH + 1))

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          echo "tag=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ponkoog/univercity:latest
            ponkoog/univercity:${{ steps.version.outputs.tag }}

  deploy:
    name: GitOps Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: kube
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update Deployment Image
        run: |
          sed -i "s|image: ponkoog/univercity:.*|image: ponkoog/univercity:${{ needs.build.outputs.image_tag }}|g" k8s/deployment.yml

      - name: Update VERSION
        run: |
          echo "${{ needs.build.outputs.version }}" > VERSION

      - name: Commit Changes
        run: |
          git add k8s/deployment.yml
          git add VERSION

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "release: ${{ needs.build.outputs.image_tag }}"

      - name: Push Changes
        run: |
          git push origin HEAD:kube