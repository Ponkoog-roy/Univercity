name: Build Test Deploy

on:
  push:
    branches:
      - kube
    paths-ignore:
      - "k8s/deployment.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: ponkoog/univercity

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --if-present

      - name: Run Tests
        run: pnpm test --if-present

      - name: Verify Production Build
        run: pnpm build

  build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: vars
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}

  deploy:
    name: Deploy (GitOps)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: kube
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update Kubernetes Manifest
        run: |
          sed -i "s|image: ponkoog/univercity:.*|image: ponkoog/univercity:${{ needs.build.outputs.image_tag }}|g" k8s/deployment.yml

      - name: Commit Manifest Change
        run: |
          git add k8s/deployment.yml

          if git diff --cached --quiet; then
            echo "No manifest changes detected"
            exit 0
          fi

          git commit -m "ci: deploy image ${{ needs.build.outputs.image_tag }}"

      - name: Push Changes
        run: |
          git push origin kube