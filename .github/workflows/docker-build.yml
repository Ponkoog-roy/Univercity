name: Build Test Deploy

on:
  push:
    branches:
      - kube
    paths-ignore:
      - "k8s/deployment.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: ponkoog/univercity

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests
        run: |
          test -f k8s/deployment.yml
          test -f k8s/service.yml
          test -f k8s/ingress.yml

  build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: meta
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ponkoog/univercity:latest
            ponkoog/univercity:${{ steps.meta.outputs.tag }}

  deploy:
    name: GitOps Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: kube
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update Image Tag
        run: |
          sed -i "s|image: ponkoog/univercity:.*|image: ponkoog/univercity:${{ needs.build.outputs.image_tag }}|g" k8s/deployment.yml

      - name: Commit Changes
        run: |
          git add k8s/deployment.yml

          if git diff --cached --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git commit -m "ci: deploy image ${{ needs.build.outputs.image_tag }}"

      - name: Push Changes
        run: |
          git push origin kube