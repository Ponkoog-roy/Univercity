name: Build Push Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ponkoog/univercity:latest
            ponkoog/univercity:${{ github.sha }}

  deploy:
    needs: docker
    runs-on: self-hosted

    steps:
      - name: Update Kubernetes Deployment
        shell: powershell
        run: |
          kubectl set image deployment/uni-frontend `
          frontend=ponkoog/univercity:${{ github.sha }} `
          -n univercity

      - name: Wait for Rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/uni-frontend -n univercity

      - name: Verify Image
        shell: powershell
        run: |
          kubectl get deployment uni-frontend `
          -n univercity `
          -o jsonpath="{.spec.template.spec.containers[0].image}"

      - name: Show Pods
        shell: powershell
        run: |
          kubectl get pods -n univercity