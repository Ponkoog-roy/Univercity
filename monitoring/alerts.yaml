groups:
  - name: univercity-alerts

    rules:

      - alert: HighCPUUsage
        expr: sum(rate(container_cpu_usage_seconds_total{namespace="univercity"}[5m])) * 100 > 80
        for: 2m

        labels:
          severity: warning

        annotations:
          summary: High CPU Usage
          description: Univercity CPU usage exceeded 80%.

      - alert: PodRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace="univercity"}[10m]) > 0
        for: 1m

        labels:
          severity: critical

        annotations:
          summary: Pod Restart Detected
          description: A pod restarted in univercity namespace.